<!--
  Cheeky companion chat UI.
  Single file. No build step. localStorage holds history.
  Buttons: clear chat, change "mood" (just nudges the next message style).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mocha ☕</title>
<style>
  :root {
    --bg: #1a1320;
    --card: #251a2e;
    --text: #f3e9f7;
    --muted: #b9a7c4;
    --accent: #ff7ab6;
    --accent-2: #c084fc;
    --user-bg: linear-gradient(135deg, #ff7ab6, #c084fc);
    --bot-bg: #2f2238;
    --border: #3b2d47;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(at top, #2a1a35 0%, var(--bg) 60%);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%; max-width: 560px;
    display: flex; flex-direction: column;
    height: 100dvh;
  }
  header {
    padding: 14px 18px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--user-bg);
    display: grid; place-items: center;
    font-size: 20px;
  }
  .who { display: flex; flex-direction: column; }
  .who b { font-size: 15px; }
  .who span { font-size: 12px; color: var(--muted); }
  .actions { margin-left: auto; display: flex; gap: 6px; }
  .actions button {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  .actions button:hover { color: var(--text); border-color: var(--accent); }

  .chat {
    flex: 1; overflow-y: auto;
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px; border-radius: 18px;
    line-height: 1.4; font-size: 15px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bg); color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bg);
    border-bottom-left-radius: 4px;
  }
  .typing { opacity: .6; font-style: italic; }

  form {
    display: flex; gap: 8px;
    padding: 12px; border-top: 1px solid var(--border);
    background: var(--card);
  }
  textarea {
    flex: 1; resize: none;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 18px;
    padding: 10px 14px; font: inherit;
    max-height: 120px; min-height: 42px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button.send {
    background: var(--user-bg); color: white;
    border: none; border-radius: 50%;
    width: 42px; height: 42px; cursor: pointer;
    font-size: 18px;
  }
  button.send:disabled { opacity: .5; cursor: not-allowed; }

  /* Toast — out-of-band notification for stream errors / system messages.
     Lives at top-center, auto-dismisses after a few seconds. Not a chat msg. */
  .toast-stack {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 6px;
    z-index: 100; pointer-events: none;
    max-width: 90vw;
  }
  .toast {
    background: var(--card); color: var(--text);
    border: 1px solid var(--red, #e57373);
    border-radius: 10px;
    padding: 8px 14px; font-size: 13px;
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
    pointer-events: auto; cursor: pointer;
    animation: toast-in .25s ease-out;
    max-width: 380px;
  }
  .toast b { color: var(--accent); margin-right: 4px; }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Memory banner — collapsible "what came before" summary.
     Closed by default (one-line preview). Click to expand. */
  .memory {
    margin: 8px 16px 0; padding: 8px 12px;
    background: var(--bot-bg); border: 1px dashed var(--border);
    border-radius: 12px;
    font-size: 12px; color: var(--muted); line-height: 1.4;
    cursor: pointer; user-select: none;
    display: none;
  }
  .memory.show { display: block; }
  .memory b { color: var(--accent-2); font-weight: 600; }
  .memory .mem-body {
    overflow: hidden;
    max-height: 1.4em;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .memory.open .mem-body {
    white-space: normal;
    max-height: 200px;
    overflow-y: auto;
  }
  .memory .mem-caret { float: right; opacity: .7; font-size: 10px; }

  /* Emoji picker — small popover anchored above the input bar. */
  button.emoji {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 50%;
    width: 42px; height: 42px; cursor: pointer;
    font-size: 18px; flex-shrink: 0;
  }
  button.emoji:hover { border-color: var(--accent); }
  .picker {
    position: absolute; bottom: 72px; left: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 8px;
    display: none; grid-template-columns: repeat(8, 1fr); gap: 4px;
    max-width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    z-index: 10;
  }
  .picker.open { display: grid; }
  .picker span {
    cursor: pointer; font-size: 20px; text-align: center;
    padding: 4px; border-radius: 6px;
    min-width: 32px; min-height: 32px;
    display: grid; place-items: center;
  }
  .picker span:hover { background: var(--bot-bg); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar">☕</div>
    <div class="who"><b>mocha</b><span>online · cheeky mode</span></div>
    <div class="actions">
      <button id="clear">clear</button>
    </div>
  </header>

  <div id="toasts" class="toast-stack"></div>
  <div id="memory" class="memory" title="what mocha remembers from earlier"></div>
  <div class="chat" id="chat"></div>

  <div id="picker" class="picker"></div>

  <form id="form" style="position: relative;">
    <button type="button" class="emoji" id="emojiBtn" title="emoji">😊</button>
    <textarea id="input" placeholder="say something..." rows="1"></textarea>
    <button class="send" id="send" type="submit">➤</button>
  </form>
</div>

<script>
// History + memory live in localStorage. Backend is stateless.
const KEY = "mocha.history.v1";
const MEM_KEY = "mocha.memory.v1";
// Compaction triggers when full history exceeds this many messages.
// We then fold everything older than the last KEEP_RECENT into memory.
const COMPACT_THRESHOLD = 20;
const KEEP_RECENT = 10;

const chatEl = document.getElementById("chat");
const memEl = document.getElementById("memory");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

let history = JSON.parse(localStorage.getItem(KEY) || "[]");
let memory = localStorage.getItem(MEM_KEY) || "";

function save() {
  localStorage.setItem(KEY, JSON.stringify(history));
  localStorage.setItem(MEM_KEY, memory);
}

// ---- Toast (out-of-band notifications) ------------------------------------
// Backend wraps errors in \x00MOCHA_ERR\x00 ... \x00/MOCHA_ERR\x00 markers.
// We strip them out of visible chat and pop them as toasts at the top instead.
const TOAST_OPEN = "\x00MOCHA_ERR\x00";
const TOAST_CLOSE = "\x00/MOCHA_ERR\x00";
const ERR_RE = new RegExp(TOAST_OPEN + "([\\s\\S]*?)" + TOAST_CLOSE, "g");
const toastsEl = document.getElementById("toasts");

function toast(message, ttlMs = 5000) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = "<b>⚠</b>" + message.replace(/</g, "&lt;");
  el.onclick = () => el.remove();
  toastsEl.appendChild(el);
  setTimeout(() => el.remove(), ttlMs);
}

// Returns {clean, errors} — visible text with all error blocks stripped, plus
// the list of error message bodies pulled out.
function extractErrors(raw) {
  const errors = [];
  const clean = raw.replace(ERR_RE, (_full, body) => {
    errors.push(body.trim());
    return "";
  });
  return { clean, errors };
}

function renderMemory() {
  if (memory) {
    // Title row stays single-line; body holds the actual memory and is the
    // part that expands. Click anywhere on the banner to toggle.
    memEl.innerHTML =
      '<b>📜 earlier <span class="mem-caret">▼ tap to expand</span></b>' +
      '<div class="mem-body">' + memory.replace(/</g, "&lt;") + "</div>";
    memEl.classList.add("show");
  } else {
    memEl.classList.remove("show");
    memEl.classList.remove("open");
  }
}
// Single click handler — toggles expanded state.
document.getElementById("memory").addEventListener("click", () => {
  memEl.classList.toggle("open");
  const caret = memEl.querySelector(".mem-caret");
  if (caret) caret.textContent = memEl.classList.contains("open")
    ? "▲ tap to collapse"
    : "▼ tap to expand";
});

function render() {
  chatEl.innerHTML = "";
  for (const m of history) {
    const div = document.createElement("div");
    div.className = "msg " + (m.role === "user" ? "user" : "bot");
    div.textContent = m.content;
    chatEl.appendChild(div);
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function loadGreeting() {
  if (history.length > 0) return;
  const r = await fetch("/api/greeting");
  const { greeting } = await r.json();
  history.push({ role: "assistant", content: greeting });
  save(); render();
}

document.getElementById("clear").onclick = () => {
  if (!confirm("clear all chat?")) return;
  history = []; memory = ""; save();
  chatEl.innerHTML = ""; renderMemory();
  loadGreeting();
};

// After each turn, if we've grown past threshold, fold the older slice into memory.
// "Older slice" = everything except the last KEEP_RECENT messages.
async function maybeCompact() {
  if (history.length <= COMPACT_THRESHOLD) return;
  const older = history.slice(0, history.length - KEEP_RECENT);
  try {
    const r = await fetch("/api/compact", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: older, prior_memory: memory })
    });
    const { memory: newMem } = await r.json();
    if (newMem) {
      memory = newMem;
      save();
      renderMemory();
    }
  } catch (e) {
    console.warn("compaction failed (non-fatal)", e);
  }
}

// Auto-grow textarea
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

// Enter to send, Shift+Enter for newline
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault(); form.requestSubmit();
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  history.push({ role: "user", content: text });
  save(); render();
  input.value = ""; input.style.height = "auto";
  sendBtn.disabled = true;

  // Streaming bot bubble
  const botDiv = document.createElement("div");
  botDiv.className = "msg bot typing";
  botDiv.textContent = "...";
  chatEl.appendChild(botDiv);
  chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ history, memory })
    });

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let acc = "";          // visible chat content
    let raw = "";          // raw stream so far (used to detect error sentinels)
    let toastedCount = 0;  // how many error blocks we've already shown
    botDiv.classList.remove("typing");
    botDiv.textContent = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      raw += decoder.decode(value, { stream: true });
      // Strip any \x00MOCHA_ERR\x00...\x00/MOCHA_ERR\x00 blocks out of the visible
      // chat and toast them instead. Errors can arrive at any point in the stream.
      const { clean, errors } = extractErrors(raw);
      // Only toast newly-completed errors, not ones we already showed.
      for (let i = toastedCount; i < errors.length; i++) toast(errors[i]);
      toastedCount = errors.length;
      acc = clean;
      botDiv.textContent = acc;
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    if (acc.trim()) {
      // Only commit non-empty replies to history. An empty acc means the model
      // never produced anything (only errors) — let the user retry instead.
      history.push({ role: "assistant", content: acc });
      save();
      maybeCompact();
    } else {
      // Remove the empty bot bubble entirely — the toast already told the story.
      botDiv.remove();
    }
  } catch (err) {
    botDiv.remove();
    toast("network error — " + err.message);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

// ---- Emoji picker ---------------------------------------------------------
// Curated list, vibe-matched to mocha's cheeky energy. Edit freely.
const EMOJIS = [
  "😊","😏","😅","🙈","👀","😂","🤭","😜",
  "☕","🍫","🌧️","🌙","✨","💀","🔥","💛",
  "🥹","😘","😩","😭","🥲","🙄","😴","🤔",
  "💔","❤️","💞","💕","💋","🫶","🌹","🍷",
  "👋","🙏","🫣","🫠","🤌","💀","🙃","😇"
];
const pickerEl = document.getElementById("picker");
const emojiBtn = document.getElementById("emojiBtn");

// Build the grid once.
for (const e of EMOJIS) {
  const s = document.createElement("span");
  s.textContent = e;
  s.onclick = () => insertEmoji(e);
  pickerEl.appendChild(s);
}

function insertEmoji(emoji) {
  // Insert at cursor position so multi-emoji feels natural.
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;
  input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
  const pos = start + emoji.length;
  input.setSelectionRange(pos, pos);
  input.focus();
  input.dispatchEvent(new Event("input")); // re-run auto-grow
}

emojiBtn.onclick = (e) => {
  e.stopPropagation();
  pickerEl.classList.toggle("open");
};
// Close picker when clicking outside it.
document.addEventListener("click", (e) => {
  if (!pickerEl.contains(e.target) && e.target !== emojiBtn) {
    pickerEl.classList.remove("open");
  }
});

render(); renderMemory(); loadGreeting();
</script>
</body>
</html>
