<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Mocha brand: pink→purple gradient round-rect, coffee glyph centered.
       SVG favicon is sharp at any DPR + theme-respects (the gradient sits
       on a tinted ground so it reads on light + dark browser chrome). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7ab6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#g)"/>
  <text x="50" y="56" text-anchor="middle" dominant-baseline="middle"
        font-size="58" font-family="-apple-system, Segoe UI Emoji, sans-serif">☕</text>
</svg>
