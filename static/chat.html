<!--
  Chat page — per-persona conversation.
  Reads ?persona=<slug> from URL on load. Fetches metadata from
  /api/persona/<slug>. All history + memory in localStorage, keyed by slug.

  No build step; single file, vanilla JS.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  interactive-widget=resizes-content → on mobile, when the soft keyboard opens,
  the layout viewport shrinks instead of the keyboard floating over our UI.
  This is THE fix for the classic "input disappears under keyboard" chat bug.
-->
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>mocha — chat</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<style>
  :root {
    --bg: #1a1320;
    --card: #251a2e;
    --text: #f3e9f7;
    --muted: #b9a7c4;
    --accent: #ff7ab6;
    --accent-2: #c084fc;
    --user-bg: linear-gradient(135deg, #ff7ab6, #c084fc);
    --bot-bg: #2f2238;
    --border: #3b2d47;
  }
  * { box-sizing: border-box; }
  /* Lock html/body to viewport height + no body scroll. The only scrollable
     thing inside the chat page is `.chat`. This prevents the body from
     scrolling when the user touches inside / outside the messages list, which
     was making the input bar slide off-screen on mobile when the keyboard
     was open. */
  html, body {
    height: 100%; margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(at top, #2a1a35 0%, var(--bg) 60%);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%; max-width: 560px;
    display: flex; flex-direction: column;
    /* `svh` = small viewport height — always the smallest viewport even
       with browser chrome visible. Combined with the meta viewport's
       interactive-widget=resizes-content, this also shrinks when the
       on-screen keyboard appears, so our input bar stays visible. */
    height: 100svh;
  }
  header {
    padding: 14px 18px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  /* "← back" link to gallery — sits left of the avatar so it's easy to thumb
     on mobile without obscuring the persona identity. */
  a.back {
    color: var(--muted); text-decoration: none;
    font-size: 18px; padding: 4px 8px; border-radius: 8px;
    line-height: 1;
  }
  a.back:hover { color: var(--text); background: var(--bot-bg); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--user-bg);
    display: grid; place-items: center;
    font-size: 20px; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .who { display: flex; flex-direction: column; }
  .who b { font-size: 15px; }
  .who span { font-size: 12px; color: var(--muted); }
  .actions { margin-left: auto; display: flex; gap: 6px; align-items: center; position: relative; }
  .actions button {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 10px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .actions button:hover { color: var(--text); border-color: var(--accent); }
  .lang-btn { text-transform: uppercase; letter-spacing: .3px; }

  /* Language picker popover — anchored under the LANG button in header.
     Small list of common targets, click to set. Saved in localStorage.
     Stays purposely small + boring — translation isn't the focus. */
  .lang-pop {
    position: absolute; top: 100%; right: 0;
    margin-top: 6px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    z-index: 50; min-width: 160px;
    display: none;
  }
  .lang-pop.open { display: block; }
  .lang-pop .lang-item {
    display: block; width: 100%; text-align: left;
    background: transparent; color: var(--text); border: 0;
    padding: 7px 10px; border-radius: 8px;
    font-size: 13px; cursor: pointer;
  }
  .lang-pop .lang-item:hover { background: var(--bot-bg); }
  .lang-pop .lang-item.active { color: var(--accent-2); font-weight: 600; }
  .lang-pop .lang-item .code { color: var(--muted); font-size: 11px; margin-left: 6px; text-transform: uppercase; }

  .chat {
    flex: 1; overflow-y: auto;
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
    /* Stop scroll-chaining: when user hits the top of chat list and keeps
       dragging, don't let the page itself start scrolling. Kills the
       "page slides up and input disappears" bug. */
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px; border-radius: 18px;
    line-height: 1.4; font-size: 15px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bg); color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bg);
    border-bottom-left-radius: 4px;
    position: relative;
  }

  /* Bot-msg group: original bubble + (optional) translation block below.
     The group wraps both so they stack neatly and hug the left edge. */
  .bot-group { display: flex; flex-direction: column; gap: 4px; max-width: 80%; align-self: flex-start; }
  .bot-group .msg.bot { max-width: 100%; }

  /* Translate trigger — tiny icon-only button under the bot bubble. Visible
     only on bot messages. Designed to be unobtrusive (Google Translate-style).
     Tooltip on hover shows the current target language. */
  .translate-btn {
    align-self: flex-start;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 50%;
    width: 24px; height: 24px;
    padding: 0; font-size: 12px; line-height: 1;
    cursor: pointer;
    display: grid; place-items: center;
    transition: color .15s, border-color .15s, transform .15s;
  }
  .translate-btn:hover { color: var(--accent-2); border-color: var(--accent-2); transform: scale(1.08); }
  .translate-btn:disabled { opacity: .5; cursor: wait; transform: none; }
  .translate-btn.active { color: var(--accent-2); border-color: var(--accent-2); background: rgba(192,132,252,.1); }

  /* Translation result block — intentionally lower visual weight than the
     original bubble. Smaller font, muted color, thin left rule. The original
     reply stays the focus; the translation is a secondary read-along. */
  .translation {
    align-self: flex-start; max-width: 100%;
    padding: 4px 0 4px 10px;
    border-left: 2px solid var(--border);
    font-size: 13px; line-height: 1.45; color: var(--muted);
    white-space: pre-wrap; word-wrap: break-word;
  }
  /* Tiny lang code in the corner — single low-key signal so users know
     which language they're reading without a heavy "MACHINE · BN" label. */
  .translation .tr-label {
    font-size: 9px; color: var(--subtle, var(--muted));
    text-transform: uppercase; letter-spacing: .5px;
    margin-right: 6px; opacity: .6;
  }
  /* Animated 3-dot typing indicator — replaces the static "..." so users see
     a clear "they're typing" signal during the read-delay + first-byte wait. */
  .typing-dots {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 2px;
  }
  .typing-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes typing-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .4; }
    40%          { transform: translateY(-4px); opacity: 1; }
  }

  form {
    display: flex; gap: 8px;
    padding: 12px; border-top: 1px solid var(--border);
    background: var(--card);
  }
  textarea {
    flex: 1; resize: none;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 18px;
    padding: 10px 14px; font: inherit;
    max-height: 120px; min-height: 42px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button.send {
    background: var(--user-bg); color: white;
    border: none; border-radius: 50%;
    width: 42px; height: 42px; cursor: pointer;
    font-size: 18px;
  }
  button.send:disabled { opacity: .5; cursor: not-allowed; }

  /* Toast — out-of-band notification for stream errors / system messages. */
  .toast-stack {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 6px;
    z-index: 100; pointer-events: none;
    max-width: 90vw;
  }
  .toast {
    background: var(--card); color: var(--text);
    border: 1px solid var(--red, #e57373);
    border-radius: 10px;
    padding: 8px 14px; font-size: 13px;
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
    pointer-events: auto; cursor: pointer;
    animation: toast-in .25s ease-out;
    max-width: 380px;
  }
  .toast b { color: var(--accent); margin-right: 4px; }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Memory banner — collapsible summary of compacted older turns. */
  .memory {
    margin: 8px 16px 0; padding: 8px 12px;
    background: var(--bot-bg); border: 1px dashed var(--border);
    border-radius: 12px;
    font-size: 12px; color: var(--muted); line-height: 1.4;
    cursor: pointer; user-select: none;
    display: none;
  }
  .memory.show { display: block; }
  .memory b { color: var(--accent-2); font-weight: 600; }
  .memory .mem-body {
    overflow: hidden;
    max-height: 1.4em;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .memory.open .mem-body {
    white-space: normal;
    max-height: 200px;
    overflow-y: auto;
  }
  .memory .mem-caret { float: right; opacity: .7; font-size: 10px; }

  /* Emoji picker — small popover anchored above the input bar. */
  button.emoji {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 50%;
    width: 42px; height: 42px; cursor: pointer;
    font-size: 18px; flex-shrink: 0;
  }
  button.emoji:hover { border-color: var(--accent); }
  .picker {
    position: absolute; bottom: 72px; left: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 8px;
    display: none; grid-template-columns: repeat(8, 1fr); gap: 4px;
    max-width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    z-index: 10;
  }
  .picker.open { display: grid; }
  .picker span {
    cursor: pointer; font-size: 20px; text-align: center;
    padding: 4px; border-radius: 6px;
    min-width: 32px; min-height: 32px;
    display: grid; place-items: center;
  }
  .picker span:hover { background: var(--bot-bg); }

  /* ---- Modal (clear-chat confirmation) -------------------------------- */
  /* Native confirm() is ugly + bypasses our theme. This modal lives at body
     level, full-screen backdrop, dialog card centered. Closes on backdrop
     click, ESC key, or "continue chat" button. */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(10, 5, 16, 0.7);
    backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    z-index: 200;
    animation: backdrop-in .15s ease-out;
  }
  .modal-backdrop.open { display: flex; }
  @keyframes backdrop-in {
    from { opacity: 0; } to { opacity: 1; }
  }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    max-width: 380px; width: calc(100% - 32px);
    box-shadow: 0 16px 48px rgba(0,0,0,.5);
    animation: modal-in .2s ease-out;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--bot-bg);
    display: grid; place-items: center;
    font-size: 22px; margin-bottom: 14px;
  }
  .modal h3 {
    font-size: 18px; font-weight: 700; margin: 0 0 6px;
    color: var(--text);
  }
  .modal p {
    font-size: 13px; color: var(--muted); line-height: 1.5;
    margin: 0 0 20px;
  }
  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end;
  }
  .modal-actions button {
    padding: 9px 16px; border-radius: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border);
    transition: border-color .15s, background .15s;
  }
  .btn-cancel {
    background: transparent; color: var(--text);
  }
  .btn-cancel:hover { border-color: var(--accent-2); }
  .btn-danger {
    background: var(--user-bg); color: white; border-color: transparent;
  }
  .btn-danger:hover { filter: brightness(1.1); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/" class="back" title="back to gallery">←</a>
    <div class="avatar" id="avatar">☕</div>
    <div class="who"><b id="who-name">…</b><span id="who-tag">online</span></div>
    <div class="actions">
      <!-- Language picker: shows the active translate target. Click → popover. -->
      <button id="langBtn" class="lang-btn" title="translation language">bn</button>
      <div id="langPop" class="lang-pop" role="menu"></div>
      <button id="clear">clear</button>
    </div>
  </header>

  <div id="toasts" class="toast-stack"></div>
  <div id="memory" class="memory" title="what they remember from earlier"></div>
  <div class="chat" id="chat"></div>

  <div id="picker" class="picker"></div>

  <!-- Clear-chat confirmation modal. Hidden until .open is added. -->
  <div id="modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <div class="modal-icon">🧹</div>
      <h3>clear this chat?</h3>
      <p>this wipes your chat history with <b id="modal-name">them</b> and their memory of you. only on this browser — we don't store anything. can't be undone.</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="modal-cancel">continue chat</button>
        <button class="btn-danger" id="modal-confirm">clear memory</button>
      </div>
    </div>
  </div>

  <form id="form" style="position: relative;">
    <button type="button" class="emoji" id="emojiBtn" title="emoji">😊</button>
    <textarea id="input" placeholder="say something..." rows="1"></textarea>
    <button class="send" id="send" type="submit">➤</button>
  </form>
</div>

<script>
// ---- Persona bootstrap ----------------------------------------------------
// We read ?persona=<slug> from the URL. If missing or unknown, we bounce back
// to the gallery — the chat page is meaningless without a target persona.
const params = new URLSearchParams(location.search);
const PERSONA_SLUG = params.get("persona") || "";
if (!PERSONA_SLUG) { location.replace("/"); }

// localStorage keys are namespaced per persona so each character has its own
// conversation. Server stays stateless — it only sees what we send.
const KEY = `mocha.history.${PERSONA_SLUG}`;
const MEM_KEY = `mocha.memory.${PERSONA_SLUG}`;
const COMPACT_THRESHOLD = 20;
const KEEP_RECENT = 10;

// Persona metadata, filled by /api/persona/<slug> on load.
let persona = null;

const chatEl = document.getElementById("chat");
const memEl = document.getElementById("memory");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

let history = JSON.parse(localStorage.getItem(KEY) || "[]");
let memory = localStorage.getItem(MEM_KEY) || "";

function save() {
  localStorage.setItem(KEY, JSON.stringify(history));
  localStorage.setItem(MEM_KEY, memory);
}

// ---- Toast (out-of-band notifications) ------------------------------------
const TOAST_OPEN = "\x00MOCHA_ERR\x00";
const TOAST_CLOSE = "\x00/MOCHA_ERR\x00";
const ERR_RE = new RegExp(TOAST_OPEN + "([\\s\\S]*?)" + TOAST_CLOSE, "g");
const toastsEl = document.getElementById("toasts");

function toast(message, ttlMs = 5000) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = "<b>⚠</b>" + message.replace(/</g, "&lt;");
  el.onclick = () => el.remove();
  toastsEl.appendChild(el);
  setTimeout(() => el.remove(), ttlMs);
}

function extractErrors(raw) {
  const errors = [];
  const clean = raw.replace(ERR_RE, (_full, body) => {
    errors.push(body.trim());
    return "";
  });
  return { clean, errors };
}

function renderMemory() {
  if (memory) {
    memEl.innerHTML =
      '<b>📜 earlier <span class="mem-caret">▼ tap to expand</span></b>' +
      '<div class="mem-body">' + memory.replace(/</g, "&lt;") + "</div>";
    memEl.classList.add("show");
  } else {
    memEl.classList.remove("show");
    memEl.classList.remove("open");
  }
}
memEl.addEventListener("click", () => {
  memEl.classList.toggle("open");
  const caret = memEl.querySelector(".mem-caret");
  if (caret) caret.textContent = memEl.classList.contains("open")
    ? "▲ tap to collapse"
    : "▼ tap to expand";
});

// ---- Translation target preference ---------------------------------------
// Priority order:
//   1. localStorage override (user clicked a different language in the picker)
//   2. navigator.language (device-set browser locale)
//   3. "bn" fallback
//
// Caveat: navigator.language reflects the DEVICE, not the user's nationality.
// A Bangladeshi in Malaysia gets "ms" by default. That's why the picker
// exists — one click to override + saved to localStorage.
const LANG_KEY = "mocha.translate_target";
const BROWSER_LANG = (navigator.language || "bn").split("-")[0].toLowerCase();
// English→English is pointless (chat is already English), so map to bn.
const DEFAULT_TARGET = BROWSER_LANG === "en" ? "bn" : BROWSER_LANG;
let TRANSLATE_TARGET = localStorage.getItem(LANG_KEY) || DEFAULT_TARGET;

// Common targets the picker shows. Keep this list short on purpose —
// translation isn't the focus, just a utility.
const LANG_OPTIONS = [
  { code: "bn", name: "বাংলা" },
  { code: "hi", name: "हिन्दी" },
  { code: "ur", name: "اردو" },
  { code: "id", name: "Indonesia" },
  { code: "ms", name: "Melayu" },
  { code: "ar", name: "العربية" },
  { code: "es", name: "Español" },
  { code: "zh", name: "中文" },
  { code: "en", name: "English" },
];

// In-memory cache: don't re-translate the same string in a single tab
// session. Keyed by the raw text → translated string. Cleared on reload.
const translationCache = new Map();

// Append a single message DOM node to the chat container.
// Bot messages get wrapped in a group with a "translate" button so the user
// can request a Bengali rendering inline. User messages stay simple.
function appendMessage(m) {
  if (m.role === "user") {
    const div = document.createElement("div");
    div.className = "msg user";
    div.textContent = m.content;
    chatEl.appendChild(div);
    return div;
  }
  // bot message → group (bubble + translate button + optional translation block)
  const group = document.createElement("div");
  group.className = "bot-group";

  const bubble = document.createElement("div");
  bubble.className = "msg bot";
  bubble.textContent = m.content;
  group.appendChild(bubble);

  const btn = makeTranslateBtn(bubble, group);
  group.appendChild(btn);

  chatEl.appendChild(group);
  return bubble;  // returning bubble lets the streaming loop write into it
}

function render() {
  chatEl.innerHTML = "";
  for (const m of history) appendMessage(m);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// Google-Translate-style icon — two-script glyph (A文) shrunk into a 24px
// circle. Inline SVG so it scales crisply and inherits currentColor for
// the dark theme without bundling assets.
const TRANSLATE_ICON_SVG =
  '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">' +
  '<path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17' +
  'C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02' +
  'L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33' +
  'L19.12 17h-3.24z"/></svg>';

// Factory for the translate button. Icon-only (Google Translate-style),
// title attribute carries the current target language so users can hover
// to confirm. Tiny on purpose — translation is a utility, not the headline.
function makeTranslateBtn(bubble, group) {
  const btn = document.createElement("button");
  btn.className = "translate-btn";
  btn.type = "button";
  btn.title = `translate to ${TRANSLATE_TARGET}`;
  btn.innerHTML = TRANSLATE_ICON_SVG;
  btn.onclick = () => onTranslateClick(btn, bubble, group);
  return btn;
}

// Translate-button handler. Toggle behavior:
//   first click  → fetch, show translation block under the bubble
//   second click → remove the block (button label flips)
// Cache is per-text so re-clicking shows the prior translation instantly.
async function onTranslateClick(btn, bubble, group) {
  // If we already rendered a translation, just toggle it off.
  const existing = group.querySelector(".translation");
  if (existing) {
    existing.remove();
    btn.classList.remove("active");
    btn.title = `translate to ${TRANSLATE_TARGET}`;
    return;
  }
  const text = bubble.textContent;
  if (!text.trim()) return;

  btn.disabled = true;
  btn.innerHTML = "<span style='font-size:10px'>…</span>";  // tiny spinner stand-in
  btn.title = "translating…";

  // Cache key includes the target language so switching targets later doesn't
  // serve a stale translation for the same source text.
  const cacheKey = `${TRANSLATE_TARGET}::${text}`;
  try {
    let translated = translationCache.get(cacheKey);
    if (translated == null) {
      const r = await fetch("/api/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, target: TRANSLATE_TARGET }),
      });
      if (!r.ok) {
        const errBody = await r.json().catch(() => ({}));
        throw new Error(errBody.detail || `HTTP ${r.status}`);
      }
      const data = await r.json();
      translated = data.translated || "";
      translationCache.set(cacheKey, translated);
    }

    const block = document.createElement("div");
    block.className = "translation";
    // Lang code is inline (not a header) so it doesn't dominate. The block's
    // muted color + thin left rule already signal "this is secondary".
    block.innerHTML =
      `<span class="tr-label">${TRANSLATE_TARGET}</span>` +
      escapeHtml(translated || "(empty)");
    // Insert AFTER the bubble, BEFORE the button so the button stays at the bottom.
    group.insertBefore(block, btn);
    btn.classList.add("active");
    btn.title = "hide translation";
  } catch (err) {
    // Flash on the button + toast — both signals so the failure is unmissable.
    toast("translation failed — " + (err.message || "unknown error"));
    btn.title = `translate to ${TRANSLATE_TARGET}`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = TRANSLATE_ICON_SVG;   // restore icon (whether success or fail)
  }
}

// Tiny escape — safe HTML for the translation block (which uses innerHTML
// for the label). Bubble content goes through textContent and skips this.
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ---- Persona load + header paint ------------------------------------------
async function loadPersona() {
  try {
    const r = await fetch(`/api/persona/${encodeURIComponent(PERSONA_SLUG)}`);
    if (!r.ok) { location.replace("/"); return; }
    persona = await r.json();
  } catch {
    location.replace("/"); return;
  }
  document.title = `mocha — ${persona.name.toLowerCase()}`;
  document.getElementById("who-name").textContent = persona.name.toLowerCase();
  document.getElementById("who-tag").textContent =
    `${persona.age} · ${persona.profession.toLowerCase()}`;

  // Avatar: try image at /persona/<file>; fall back to emoji on 404 or empty.
  const avEl = document.getElementById("avatar");
  if (persona.avatar) {
    const img = new Image();
    img.onload = () => { avEl.innerHTML = ""; avEl.appendChild(img); };
    img.onerror = () => { avEl.textContent = persona.emoji || "☕"; };
    img.alt = persona.name;
    img.src = `/persona/${persona.avatar}`;
  } else {
    avEl.textContent = persona.emoji || "☕";
  }

  // Greeting only if this is a brand-new conversation for this persona.
  if (history.length === 0 && persona.greeting) {
    history.push({ role: "assistant", content: persona.greeting });
    save(); render();
  }
}

// ---- Clear-chat modal -----------------------------------------------------
// Browser-side clear, but routed through a styled confirmation modal so the
// destructive action gets one moment of friction (and matches the rest of the
// dark UI). Backdrop click / ESC / "continue chat" all dismiss without action.
const modalEl = document.getElementById("modal");
const modalNameEl = document.getElementById("modal-name");

function openModal() {
  if (persona) modalNameEl.textContent = persona.name;
  modalEl.classList.add("open");
  modalEl.setAttribute("aria-hidden", "false");
}
function closeModal() {
  modalEl.classList.remove("open");
  modalEl.setAttribute("aria-hidden", "true");
}

document.getElementById("clear").onclick = openModal;
document.getElementById("modal-cancel").onclick = closeModal;
modalEl.addEventListener("click", (e) => {
  if (e.target === modalEl) closeModal();   // backdrop click
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modalEl.classList.contains("open")) closeModal();
});

document.getElementById("modal-confirm").onclick = () => {
  history = []; memory = "";
  localStorage.removeItem(KEY);
  localStorage.removeItem(MEM_KEY);
  chatEl.innerHTML = ""; renderMemory();
  if (persona && persona.greeting) {
    history.push({ role: "assistant", content: persona.greeting });
    save(); render();
  }
  closeModal();
  toast("chat cleared (browser-side only)", 2500);
};

// After each turn, if we've grown past threshold, fold the older slice
// (everything except the last KEEP_RECENT msgs) into memory.
async function maybeCompact() {
  if (history.length <= COMPACT_THRESHOLD) return;
  const older = history.slice(0, history.length - KEEP_RECENT);
  try {
    const r = await fetch("/api/compact", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        persona: PERSONA_SLUG,
        messages: older,
        prior_memory: memory,
      }),
    });
    const { memory: newMem } = await r.json();
    if (newMem) {
      memory = newMem;
      save();
      renderMemory();
    }
  } catch (e) {
    console.warn("compaction failed (non-fatal)", e);
  }
}

// Auto-grow textarea
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

// On mobile, when the soft keyboard opens (input gains focus), scroll the
// chat to the bottom so the user sees the latest message instead of the
// middle of the conversation. Small delay lets the layout settle first.
input.addEventListener("focus", () => {
  setTimeout(() => { chatEl.scrollTop = chatEl.scrollHeight; }, 150);
});

// Enter to send, Shift+Enter for newline
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault(); form.requestSubmit();
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  history.push({ role: "user", content: text });
  save(); render();
  input.value = ""; input.style.height = "auto";
  sendBtn.disabled = true;

  // Bot bubble starts with animated typing dots. Wrapped in a bot-group so
  // the translate button can be attached once we have content. The button is
  // appended only after the stream finishes (no point translating a partial).
  const botGroup = document.createElement("div");
  botGroup.className = "bot-group";
  const botDiv = document.createElement("div");
  botDiv.className = "msg bot";
  botDiv.innerHTML =
    '<span class="typing-dots"><span></span><span></span><span></span></span>';
  botGroup.appendChild(botDiv);
  chatEl.appendChild(botGroup);
  chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        persona: PERSONA_SLUG,
        history,
        memory,
      }),
    });

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let acc = "";          // visible chat content (sentinels stripped)
    let raw = "";          // raw stream (for detecting error sentinels)
    let toastedCount = 0;  // already-shown error blocks count
    let firstByteSeen = false;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      raw += decoder.decode(value, { stream: true });
      const { clean, errors } = extractErrors(raw);
      for (let i = toastedCount; i < errors.length; i++) toast(errors[i]);
      toastedCount = errors.length;
      acc = clean;
      // Keep the typing dots visible until we actually have streamable text.
      // The first non-empty clean chunk replaces them with the streamed body.
      if (!firstByteSeen && acc.length > 0) {
        firstByteSeen = true;
        botDiv.innerHTML = "";
      }
      if (firstByteSeen) botDiv.textContent = acc;
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    if (acc.trim()) {
      history.push({ role: "assistant", content: acc });
      save();
      // Stream done — attach the translate button via the same factory the
      // initial render uses, so icon + click handler stay in sync. Previously
      // this block hand-rolled the button and went stale when the factory
      // changed (left old 🌐 emoji on the latest bubble until a hard reload).
      botGroup.appendChild(makeTranslateBtn(botDiv, botGroup));
      maybeCompact();
    } else {
      // Stream produced no text — drop the whole group (bubble + dots).
      botGroup.remove();
    }
  } catch (err) {
    botGroup.remove();
    toast("network error — " + err.message);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

// ---- Emoji picker ---------------------------------------------------------
const EMOJIS = [
  "😊","😏","😅","🙈","👀","😂","🤭","😜",
  "☕","🍫","🌧️","🌙","✨","💀","🔥","💛",
  "🥹","😘","😩","😭","🥲","🙄","😴","🤔",
  "💔","❤️","💞","💕","💋","🫶","🌹","🍷",
  "👋","🙏","🫣","🫠","🤌","💀","🙃","😇"
];
const pickerEl = document.getElementById("picker");
const emojiBtn = document.getElementById("emojiBtn");
for (const e of EMOJIS) {
  const s = document.createElement("span");
  s.textContent = e;
  s.onclick = () => insertEmoji(e);
  pickerEl.appendChild(s);
}
function insertEmoji(emoji) {
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;
  input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
  const pos = start + emoji.length;
  input.setSelectionRange(pos, pos);
  input.focus();
  input.dispatchEvent(new Event("input"));
}
emojiBtn.onclick = (e) => {
  e.stopPropagation();
  pickerEl.classList.toggle("open");
};
document.addEventListener("click", (e) => {
  if (!pickerEl.contains(e.target) && e.target !== emojiBtn) {
    pickerEl.classList.remove("open");
  }
});

// ---- Language picker (header) -------------------------------------------
// Renders a tiny popover under the LANG button. Picks the active translate
// target and saves to localStorage. Tiny on purpose — translation is utility.
const langBtn = document.getElementById("langBtn");
const langPop = document.getElementById("langPop");

function renderLangPicker() {
  langBtn.textContent = TRANSLATE_TARGET;
  langBtn.title = `translate to ${TRANSLATE_TARGET} — tap to change`;
  langPop.innerHTML = "";
  for (const opt of LANG_OPTIONS) {
    const item = document.createElement("button");
    item.className = "lang-item" + (opt.code === TRANSLATE_TARGET ? " active" : "");
    item.type = "button";
    item.innerHTML = `${escapeHtml(opt.name)} <span class="code">${opt.code}</span>`;
    item.onclick = () => {
      TRANSLATE_TARGET = opt.code;
      localStorage.setItem(LANG_KEY, opt.code);
      // Update every existing translate button title; existing translations
      // stay rendered (cached) — user can hide+reopen them in the new lang.
      for (const b of document.querySelectorAll(".translate-btn")) {
        if (!b.classList.contains("active")) b.title = `translate to ${opt.code}`;
      }
      renderLangPicker();
      langPop.classList.remove("open");
    };
    langPop.appendChild(item);
  }
}
langBtn.onclick = (e) => {
  e.stopPropagation();
  langPop.classList.toggle("open");
};
document.addEventListener("click", (e) => {
  if (!langPop.contains(e.target) && e.target !== langBtn) {
    langPop.classList.remove("open");
  }
});

// Initial paint
render(); renderMemory(); loadPersona(); renderLangPicker();
</script>
