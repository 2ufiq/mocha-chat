[project]
name = "mocha"
version = "0.1.0"
description = "Tiny cheeky companion chat — FastAPI + vanilla JS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=25.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mocha"]
